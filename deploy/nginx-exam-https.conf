server {
    listen 80;
    listen [::]:80;
    server_name exam.example.com;
    return 301 https://$host$request_uri;
}

# 考试抓拍 HTTPS 模板：替换域名和可信证书路径后使用。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/nginx/certs/exam.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/exam.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Permissions-Policy 'camera=(self), microphone=()' always;
    server_name exam.example.com;

    root /opt/enterprise-exam/current/web;
    index index.html;
    client_max_body_size 10m;

    # 课程视频上传单独放宽，其他接口保持10MB上限。
    location = /api/courses/manage/media {
        client_max_body_size 201m;
        client_body_timeout 1h;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # APK 上传独立放宽，不影响其余接口的请求体上限。
    location = /api/apps/manage {
        client_max_body_size 201m;
        client_body_timeout 15m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

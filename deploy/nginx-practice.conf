# ============================================================
# 公网练题 Nginx 配置（方案乙：独立练题实例 · 公网边界收敛）
# 文档：docs/06-architecture-practice-increment.md §1.3 / §8 / T05
#
# 边界红线：
#   - 公网 server 块**仅放行** /api/practice/** 与 /practice 静态资源；
#   - 其余 /api/** 一律 404（考试/用户/报表等内网接口对公网不可达）；
#   - 强制 HTTPS（HTTP 301 → HTTPS）+ HSTS；
#   - IP 维度限流（登录接口单独更严的 zone）；
#   - :3001 不映射公网（仅监听 127.0.0.1）。
#
# 使用：将本文件纳入 Nginx include，替换 practice.example.com / 证书路径 / 静态资源目录。
# ============================================================

# ---- 限流 zone（IP 维度；第一道防线，第二道为应用层 practiceRateLimit）----
limit_req_zone  $binary_remote_addr zone=practice_general:10m rate=30r/m;
limit_req_zone  $binary_remote_addr zone=practice_login:10m   rate=10r/m;
limit_conn_zone $binary_remote_addr zone=practice_conn:10m;

# ---- HTTP → HTTPS 跳转 ----
server {
    listen 80;
    listen [::]:80;
    server_name practice.example.com;
    return 301 https://$host$request_uri;
}

# ---- 公网 HTTPS server 块 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name practice.example.com;

    # 证书（Let's Encrypt / 企业证书）
    ssl_certificate     /etc/nginx/certs/practice.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/practice.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header Cache-Control "no-store" always;

    limit_conn practice_conn 30;

    # 访问日志（独立，便于审计公网刷量/攻击）
    access_log /var/log/nginx/practice.access.log;
    error_log  /var/log/nginx/practice.error.log warn;

    client_max_body_size 2m;

    # 1) 练题登录接口：单独更严限流
    location = /api/practice/auth/login {
        limit_req zone=practice_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001/api/practice/auth/login;
        include /etc/nginx/proxy_params.conf;   # 见下方建议内容
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2) 练题接口（含 auth/captcha、banks、sessions、check、progress、wrong-book）
    location /api/practice/ {
        limit_req zone=practice_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001/api/practice/;
        include /etc/nginx/proxy_params.conf;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3) 健康检查（可选，供运维探活）
    location = /api/health {
        proxy_pass http://127.0.0.1:3001/api/health;
    }

    # 4) 其余 /api/**：公网一律 404（内网管理/考试接口不可达）
    location /api/ {
        return 404;
    }

    # 5) 练题前端静态资源（移动端 SPA；publicPath 为 /practice/）
    location /practice/ {
        alias /var/www/practice/;
        try_files $uri $uri/ /practice/index.html;
    }

    # 6) 根路径重定向到练题首页
    location = / {
        return 302 /practice/;
    }
}

# ============================================================
# 建议：/etc/nginx/proxy_params.conf
# ------------------------------------------------------------
#   proxy_http_version 1.1;
#   proxy_set_header Host              $host;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header X-Device-Fp       $http_x_device_fp;
#   proxy_read_timeout 30s;
# ============================================================


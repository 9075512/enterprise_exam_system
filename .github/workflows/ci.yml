name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: 正式分支仅接受本仓库 dev 的 PR
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$EVENT" == "pull_request" && "$BASE" == "main" ]]; then
            [[ "$HEAD" == "dev" && "$HEAD_REPO" == "$REPO" ]] || { echo 'main 仅接受本仓库 dev 的发布 PR'; exit 1; }
          fi

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: 校验远端部署脚本语法
        run: bash -n deploy/remote-deploy.sh
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  server:
    name: server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci-only-password
      DB_NAME: enterprise_exam_system_test
      DB_NAME_TEST: enterprise_exam_system_test
      JWT_SECRET: github-actions-isolated-test-secret-not-for-deployment
      PDF_FONT_PATH: /usr/share/fonts/truetype/arphic-gbsn00lp/gbsn00lp.ttf
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: 安装 PDF 导出测试所需中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-arphic-gbsn00lp
          test -f "$PDF_FONT_PATH"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: server-dist
          path: |
            server/dist/
            server/package.json
            server/package-lock.json
          if-no-files-found: error
          retention-days: 7

  ci-success:
    name: ci-success
    if: always()
    needs: [branch-policy, web, server]
    runs-on: ubuntu-latest
    steps:
      - name: 所有测试及构建必须成功
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

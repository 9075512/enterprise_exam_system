function heading(eyebrow,title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function tag(status){return `<span class="tag ${status==='进行中'?'live':status==='未开始'?'soon':''}"><span class="dot"></span>${status}</span>`}
function examRows(items){return items.map(e=>`<tr><td><div class="exam-name"><span class="exam-symbol">${icon('file')}</span><div><strong>${esc(e.name)}</strong><span class="sub">${esc(e.dept)}</span></div></div></td><td>${tag(e.status)}</td><td><span class="mono">${esc(e.date)}</span><span class="sub">考试时长 ${e.duration} 分钟</span></td><td style="min-width:105px"><span class="mono">${e.count} <span class="muted">/ ${e.total} 人</span></span><div class="mini-progress"><i style="width:${Math.round(e.count/e.total*100)}%"></i></div></td><td><button class="link" data-detail="${esc(e.name)}">${e.status==='进行中'?'查看进度':'查看详情'} ${icon('arrow')}</button></td></tr>`).join('')}
function chart(){const week=state.period==='week';return `<svg class="chart" viewBox="0 0 620 178" preserveAspectRatio="none" role="img" aria-label="${week?'10月10日至16日':'5月至10月'}考试通过率趋势，${week?'74、80、77、88、84、92、92.6':'72、78、83、81、89、92.6'}百分比"><defs><linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3B82F6" stop-opacity=".3"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/></linearGradient></defs><g stroke="#E5E9F0" stroke-width="1" stroke-dasharray="3 4"><path d="M38 17h564M38 57h564M38 97h564M38 137h564"/></g><g><text x="0" y="21">100%</text><text x="4" y="61">80%</text><text x="4" y="101">60%</text><text x="4" y="141">40%</text></g><path d="${week?'M42 69 C72 69 106 53 135 57 S194 69 228 63 S289 33 321 41 S382 58 414 49 S478 31 507 33 S573 32 600 32':'M42 73 C95 70 105 65 154 61 S220 45 266 51 S330 60 378 55 S443 36 490 39 S555 32 600 32'} L600 138H42Z" fill="url(#chart-fill)"/><path d="${week?'M42 69 C72 69 106 53 135 57 S194 69 228 63 S289 33 321 41 S382 58 414 49 S478 31 507 33 S573 32 600 32':'M42 73 C95 70 105 65 154 61 S220 45 266 51 S330 60 378 55 S443 36 490 39 S555 32 600 32'}" fill="none" stroke="#2563EB" stroke-width="2.5"/><circle cx="600" cy="32" r="4" fill="#2563EB" stroke="white" stroke-width="2"/><g text-anchor="middle">${(week?['10.10','10.11','10.12','10.13','10.14','10.15','10.16']:['05月','06月','07月','08月','09月','10月']).map((s,i,a)=>`<text x="${42+i*558/(a.length-1)}" y="169">${s}</text>`).join('')}</g></svg>`}

 ['本月考试','12','场','较上月增加 2 场','file'],['应考人次','486','人次','较上月增加 56 人次','users'],['平均通过率','92.6','%','较上月 +4.2 个百分点','chart'],['待处理事项','18','项','阅卷 12 · 补考 4 · 复核 2','clock']
 ].map(([label,n,unit,note,ic],i)=>`<div class="stat"><div class="stat-head"><span>${label}</span>${icon(ic)}</div><div class="stat-value">${n}<small>${unit}</small></div><div class="stat-caption"><span class="${i<3?'stat-change':''}">${i<3?'↑ ':''}${note}</span></div></div>`).join('')}</section><div class="operational-notice"><div class="row"><span class="notice-dot"></span><span><strong>1 场考试正在进行</strong><span class="notice-detail">年度信息安全考核 · 128 / 156 人已交卷</span></span></div><button class="link" data-detail="2026 年度信息安全考核">查看进度 ${icon('arrow')}</button></div><div class="dashboard-grid"><section class="surface"><div class="panel-head"><div><h2>考试通过率</h2><small>按交卷日期统计 · 已公布成绩</small></div><div class="period" aria-label="趋势周期"><button data-period="week" class="${state.period==='week'?'active':''}" aria-pressed="${state.period==='week'}">近 7 天</button><button data-period="month" class="${state.period==='month'?'active':''}" aria-pressed="${state.period==='month'}">近 6 月</button></div></div><div class="chart-wrap"><div class="chart-summary"><strong class="mono">92.6<span style="font-size:14px">%</span></strong><span>最新通过率</span></div>${chart()}</div></section><section class="surface todo-panel"><div class="panel-head"><h2>待办事项</h2><span class="todo-total">共 18 项</span></div><div class="todos">${[['edit','待人工阅卷','涉及 3 场考试','12',''],['users','补考申请','待审核考生资格','4','green'],['shield','成绩复核','待核查成绩记录','2','blue']].map(([ic,title,sub,num,c])=>`<button class="todo todo-button" data-todo="${title}" data-count="${num}"><div class="todo-icon ${c}">${icon(ic)}</div><div class="info"><strong>${title}</strong><span>${sub}</span></div><span class="todo-num">${num}</span>${icon('arrow')}</button>`).join('')}</div></section></div><section class="surface table-panel"><div class="panel-head"><div class="row"><h2>近期考试</h2><span class="section-count">${state.exams.length}</span></div><button class="btn ghost small" data-nav="exams">查看全部 ${icon('arrow')}</button></div><div class="table-scroll"><table><thead><tr><th>考试名称 / 参与科室</th><th>状态</th><th>考试时间</th><th>交卷进度</th><th>操作</th></tr></thead><tbody>${examRows(state.exams.slice(0,3))}</tbody></table></div></section>`}

function exams(){return heading('','考试管理','管理考试安排、参与科室和交卷进度。',`<div class="row"><button class="btn primary" data-action="create">${icon('plus')}创建考试</button></div>`)+`<section class="surface" style="overflow:hidden"><div class="tabs" aria-label="考试状态">${['全部考试','进行中','未开始','已结束'].map(t=>`<button data-filter="${t}" class="${state.filter===t?'active':''}" aria-pressed="${state.filter===t}">${t}<span>${t==='全部考试'?state.exams.length:state.exams.filter(e=>e.status===t).length}</span></button>`).join('')}</div><div class="toolbar"><div class="row"><label class="searchbox">${icon('search')}<input id="exam-search" aria-label="搜索考试名称" placeholder="搜索考试名称…" value="${esc(state.keyword)}"></label><select id="dept-filter" aria-label="参与科室">${['全部科室','研发部','人力资源部','行政部','市场部'].map(x=>`<option ${state.department===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn ghost small" data-action="reset-filters">重置筛选</button></div><div class="table-scroll"><table><thead><tr><th>考试名称 / 参与科室</th><th>状态</th><th>考试时间</th><th>交卷进度</th><th>操作</th></tr></thead><tbody id="exam-rows">${examRows(filtered())}</tbody></table><div id="exam-empty" class="empty" ${filtered().length?'hidden':''}>${icon('search')}<h3>没有找到符合条件的考试</h3><p>换一个关键词，或清空筛选条件。</p><button class="btn small" style="margin-top:18px" data-action="reset-filters">清空筛选</button></div></div><div class="pagination"><span id="result-count" aria-live="polite">共 ${filtered().length} 场考试 · 每页 10 场</span><span class="page-current" aria-label="第1页">1</span></div></section><div class="notice" style="margin-top:20px">${icon('shield')}考试状态依据开考与结束时间显示；示例中的创建操作仅保留在当前页面会话。</div>`}
function taking(){if(state.submitted)return `<header class="exam-top"><div class="row"><span class="brand-mark">${icon('grid')}</span><h2>企业考试平台 · 在线考试</h2></div><button class="btn small" data-nav="dashboard">返回工作台</button></header><main class="exam-layout"><section class="surface result"><span class="tag live">${icon('check')}模拟交卷完成</span><h1 style="margin-top:20px">答卷提交成功</h1><div class="result-score">${questions.reduce((n,q,i)=>n+(state.answers[i]===q.answer?10:0),0)}<small style="font-size:18px"> / 100</small></div><p class="muted">已完成 ${Object.keys(state.answers).length} / 10 题，本结果仅用于演示交互。</p><div class="row" style="justify-content:center;margin-top:25px"><button class="btn" data-action="restart">重新体验</button><button class="btn primary" data-nav="dashboard">返回工作台 ${icon('arrow')}</button></div></section></main>`;
 const q=questions[state.q],count=Object.keys(state.answers).length;return `<header class="exam-top"><div class="row"><button class="iconbtn" data-nav="dashboard" aria-label="退出答题示例">${icon('close')}</button><span class="brand-mark">${icon('grid')}</span><div><h2>2026 年度信息安全考核</h2><span class="muted small">在线答题 · 演示卷 / 共 10 题</span></div></div><div class="row" style="gap:22px"><div><div class="muted" style="font-size:10px">剩余时间 · 静态演示</div><div class="timer mono">42:18</div></div><button class="btn primary" data-action="submit">交卷 ${icon('arrow')}</button></div></header><main class="exam-layout"><div class="notice">${icon('shield')}这是答题体验示例。选择答案后会在当前会话中保留，刷新页面将重置。</div><div class="exam-body"><section class="surface question-panel"><div class="row between"><div class="row"><span class="tag live">单选题</span><span class="small muted">每题 10 分</span></div><span class="mono muted small">${String(state.q+1).padStart(2,'0')} / 10</span></div><h1 class="question-title">${q.title}</h1><fieldset style="border:0;padding:0;margin:0"><legend class="small muted" style="margin-bottom:3px">请选择一个正确答案</legend>${q.options.map((o,i)=>`<label class="option ${state.answers[state.q]===i?'selected':''}"><input type="radio" name="answer" value="${i}" ${state.answers[state.q]===i?'checked':''}><span class="letter">${'ABCD'[i]}.</span><span>${o}</span></label>`).join('')}</fieldset><div class="question-footer"><button class="btn ghost small ${state.marked.has(state.q)?'marked':''}" data-action="mark" aria-pressed="${state.marked.has(state.q)}">${icon('flag')}${state.marked.has(state.q)?'已标记，稍后检查':'标记此题'}</button><div class="row"><button class="btn" data-action="previous" ${state.q===0?'disabled':''}>上一题</button><button class="btn primary" data-action="next">${state.q===9?'检查并交卷':'下一题'} ${icon('arrow')}</button></div></div></section><aside class="surface answer-card"><div class="row between"><h2>答题卡</h2><span class="small muted">${count} / 10 已答</span></div><div class="mini-progress" style="height:5px;margin:15px 0 8px"><i style="width:${count*10}%"></i></div><div class="question-grid">${questions.map((_,i)=>`<button class="${state.answers[i]!==undefined?'answered':''} ${state.q===i?'current':''} ${state.marked.has(i)?'marked':''}" data-q="${i}" aria-label="第${i+1}题，${state.answers[i]!==undefined?'已答':'未答'}${state.marked.has(i)?'，已标记':''}" ${state.q===i?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><div class="legend"><span><i class="legend-box" style="background:var(--brand-soft)"></i>已答</span><span><i class="legend-box"></i>未答</span><span><i class="dot" style="background:var(--orange)"></i>标记</span></div><div style="border-top:1px solid var(--line);padding-top:18px;margin-top:20px"><div class="row gap6 save-note">${icon('check')}答案已保留在当前会话</div><p class="muted" style="font-size:10px;margin-top:8px">正式产品需接入服务端暂存、校时及考试规则。</p></div></aside></div><footer class="pagefoot"><span>企业考试平台 · 在线答题</span><span>界面设计示例 · 非正式考试</span></footer></main>`}
function spec(){return heading('','设计规范','简洁专业版 · 白色界面、科技蓝交互、高效信息布局。',`<div class="row"><button class="btn" data-action="print">打印规范</button></div>`)+`<section class="surface spec-section spec-overview"><div class="row between wrap"><div><span class="tag blue">DESIGN SYSTEM / 01</span><h2 style="margin-top:14px;font-size:24px">让数据清晰，让操作直接。</h2><p class="muted" style="margin-top:8px">用清楚的层级和稳定的组件承载企业考务流程。</p></div><div class="spec-keywords"><span>白底</span><span>蓝色主操作</span><span>紧凑布局</span><span>清晰反馈</span></div></div></section><section class="surface spec-section"><h2>01 / 色彩</h2><p class="muted small">蓝色用于主要操作和当前选择；成功、等待、错误使用独立语义色。</p><div class="spec-grid">${[['#2563EB','交互主色','--brand'],['#172B4D','主要文字','--ink'],['#F5F7FA','页面底色','--canvas'],['#FFFFFF','内容表面','--surface'],['#E5E9F0','分隔线','--line']].map(([c,n,t])=>`<div><div class="swatch" style="background:${c}"></div><div class="swatch-name">${n}</div><div class="swatch-code">${c}<br>${t}</div></div>`).join('')}</div><div class="component-row"><span class="tag live"><span class="dot"></span>进行中</span><span class="tag success"><span class="dot"></span>已完成</span><span class="tag soon"><span class="dot"></span>待处理</span><span class="tag danger"><span class="dot"></span>操作失败</span><span class="tag">已结束</span></div></section><div class="spec-two"><section class="surface spec-section"><h2>02 / 字体</h2><p class="muted small">系统黑体 · 数字使用等宽数字特性 · 层级不依赖颜色。</p><div class="type-row"><span style="font-size:24px;font-weight:600">页面标题</span><span class="muted small">24 / 1.4 / 600</span></div><div class="type-row"><span style="font-size:15px;font-weight:600">模块标题</span><span class="muted small">15 / 1.5 / 600</span></div><div class="type-row"><span>正文与操作标签</span><span class="muted small">14 / 1.6 / 400–500</span></div><div class="type-row"><span style="font-size:12px">辅助说明</span><span class="muted small">12 / 1.6 / 400</span></div><div class="type-row"><span class="mono" style="font-size:30px;font-weight:600">92.6%</span><span class="muted small">指标 30 / 1.3 / 600</span></div></section><section class="surface spec-section"><h2>03 / 尺寸与间距</h2><p class="muted small">4px 基础网格；减少装饰留白，保留清楚的信息分组。</p><div class="spacing-row">${[4,8,12,16,24,32].map(x=>`<div><i style="height:${x}px"></i>${x}</div>`).join('')}</div><div class="type-row"><span>按钮 / 输入框</span><span class="muted small">高 36px · 圆角 6px</span></div><div class="type-row"><span>内容区域 / 弹窗</span><span class="muted small">圆角 8px / 10px</span></div><div class="type-row"><span>内容内边距 / 区域间隔</span><span class="muted small">20px / 16px</span></div><div class="type-row"><span>导航 / 顶栏</span><span class="muted small">宽 208px / 高 60px</span></div></section></div><section class="surface spec-section"><h2>04 / 交互组件</h2><p class="muted small">同一区域保留一个主要操作。图标辅助识别，不能替代必要的文字标签。</p><div class="component-row"><button class="btn primary" data-action="create">${icon('plus')}创建考试</button><button class="btn" data-nav="exams">查看考试</button><button class="btn ghost" data-action="component-toast">文本操作</button><button class="btn" disabled>不可用</button></div><div class="component-row"><label class="field" style="width:280px;margin:0">考试名称<input placeholder="请输入考试名称" aria-label="规范输入框示例"></label><label class="field" style="width:220px;margin:0">参与科室<select aria-label="规范选择框示例"><option>全部科室</option><option>研发部</option></select></label></div><div class="rules"><div class="rule"><strong>悬停 / 聚焦 / 禁用</strong><p>悬停使用中性浅底；主按钮加深蓝色。键盘焦点为 3px 蓝色外描边。禁用保持可辨识且禁止触发。</p></div><div class="rule"><strong>错误 / 提交 / 完成</strong><p>错误靠近字段；提交中阻止重复请求；失败保留输入并允许重试；成功显示简短状态反馈。</p></div><div class="rule"><strong>表格</strong><p>双行内容默认行高 64px；无纵向网格；表头浅灰；操作列固定用语。搜索、状态、科室筛选可组合并可重置。</p></div><div class="rule"><strong>答题</strong><p>选中项使用蓝色边框、浅蓝底和原生单选控件。当前题与已答状态分别表示；交卷前明确提示未答数量。</p></div></div></section><section class="surface spec-section"><h2>05 / 响应式规则</h2><div class="table-scroll"><table class="spec-table"><thead><tr><th>屏幕宽度</th><th>内容布局</th><th>导航与控件</th></tr></thead><tbody><tr><td>≥ 1200px</td><td>四列指标；图表与待办双栏；页边距 24px</td><td>208px 固定侧栏；36px 常规控件</td></tr><tr><td>741–1199px</td><td>页边距 20px；≤980px 指标两列、图表单栏</td><td>192px 固定侧栏；表格局部横向滚动</td></tr><tr><td>≤ 740px</td><td>16px 页边距；内容单栏；答题卡上移</td><td>抽屉导航；44px 触控热区；每行 5 个题号</td></tr></tbody></table></div></section><section class="surface spec-section"><h2>06 / 状态与实现边界</h2><div class="rules"><div class="rule"><strong>空数据与无结果</strong><p>首次空数据提供创建入口；筛选无结果展示清空筛选。加载骨架保持目标内容尺寸，避免布局跳动。</p></div><div class="rule"><strong>权限与考试保护</strong><p>菜单按角色与授权过滤；无权限提供返回入口；正式考试接入服务端校时、答案暂存、超时交卷与重复提交保护。</p></div><div class="rule"><strong>可访问性</strong><p>状态同时使用文字；保留键盘焦点；减少动态效果设置下关闭过渡。正式验收检查读屏、缩放、焦点顺序和实际对比度。</p></div><div class="rule"><strong>本次示例</strong><p>工作台、考试管理、在线答题与本页基础规范。数据和创建、交卷操作仅用于本地演示，未连接业务接口。</p></div></div></section>`}
function render(){document.title=`${labels[state.view]} · 企业考试平台 · UI 示例`;$('#app').innerHTML=state.view==='taking'?taking():shell(state.view==='exams'?exams():state.view==='spec'?spec():dashboard());}
function navigate(view){if(!labels[view])view='dashboard';state.view=view;history.replaceState(null,'','#'+view);render();window.scrollTo(0,0)}
let toastTimer;function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3400)}
function modal(title,body,footer){const d=$('#dialog');d.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="iconbtn" data-action="close-dialog" aria-label="关闭弹窗">${icon('close')}</button></div><div class="dialog-body">${body}</div><div class="dialog-foot">${footer||'<button class="btn primary" data-action="close-dialog">知道了</button>'}</div>`;d.showModal()}
function detail(name){const e=state.exams.find(x=>x.name===name);if(!e)return;modal(esc(e.name),`<div class="row between" style="margin-bottom:20px">${tag(e.status)}<span class="small muted">演示详情</span></div><div class="type-row"><span class="muted">试卷</span><strong>${esc(e.paper)}</strong></div><div class="type-row"><span class="muted">参与科室</span><span>${esc(e.dept)}</span></div><div class="type-row"><span class="muted">考试时间</span><span>${esc(e.date)}</span></div><div class="type-row"><span class="muted">交卷进度</span><span>${e.count} / ${e.total} 人</span></div><div class="mini-progress" style="height:7px;margin:20px 0"><i style="width:${e.count/e.total*100}%"></i></div><p class="small muted">此处展示考试详情的视觉与信息层级，正式产品可继续进入实时监考和考务处理。</p>`,`<button class="btn" data-action="close-dialog">关闭</button><button class="btn primary" data-action="try-exam">体验答题 ${icon('arrow')}</button>`)}
function submit(){const missing=10-Object.keys(state.answers).length;modal('确认提交这份答卷？',`<p style="font-size:16px;margin-bottom:12px">已答 <strong>${10-missing}</strong> 题，${missing?`还有 <strong style="color:var(--orange)">${missing}</strong> 题未作答。`:'全部题目均已作答。'}</p><p class="muted small">${state.marked.size?`你标记了 ${state.marked.size} 题，可返回检查。<br>`:''}这是本地模拟交卷，提交后会显示示例成绩。</p>`,`<button class="btn" data-action="close-dialog">继续检查</button><button class="btn primary" data-action="confirm-submit">确认交卷</button>`)}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}
 const period=e.target.closest('[data-period]');if(period){state.period=period.dataset.period;render();document.querySelector(`[data-period="${state.period}"]`).focus();return}
 const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;render();document.querySelector(`[data-filter="${state.filter}"]`).focus();return}
 const dt=e.target.closest('[data-detail]');if(dt){detail(dt.dataset.detail);return}
 const todo=e.target.closest('[data-todo]');if(todo){modal(todo.dataset.todo,`<p>${esc(todo.dataset.todo)}共 ${Number(todo.dataset.count)} 项。</p><p class="muted small" style="margin-top:12px">正式产品将按考试聚合待办，点击事项进入对应的阅卷、补考或复核处理页。本示例展示待办入口与弹窗样式。</p>`);return}
 const qb=e.target.closest('[data-q]');if(qb){state.q=Number(qb.dataset.q);render();document.querySelector(`[data-q="${state.q}"]`).focus();return}
 const a=e.target.closest('[data-action]');if(!a||a.disabled)return;
 switch(a.dataset.action){
 case'menu':$('.sidebar').classList.add('open');break;
 case'close-menu':$('.sidebar').classList.remove('open');break;
 case'close-dialog':$('#dialog').close();break;
 case'notifications':modal('通知中心',`<div class="tag live">今天 · 09:00</div><h3 style="margin-top:14px">年度信息安全考核已开考</h3><p class="muted small" style="margin-top:8px">考试开放至今日 18:00，可在考试管理中查看交卷进度。</p><div class="type-row"><span>4 条补考申请待处理</span><span class="muted small">08:45</span></div><p class="muted small" style="margin-top:15px">以上为演示通知。</p>`);break;
 case'reset-filters':state.keyword='';state.department='全部科室';state.filter='全部考试';render();$('#exam-search').focus();break;
 case'create':modal('创建一场考试',`<form id="create-form"><div class="dialog-tip">示例流程：选择试卷、设置时长和科室。保存后可在本页查看模拟考试。</div><label class="field">考试名称 <span style="color:var(--red)">*</span><input name="name" required maxlength="50" placeholder="例如：十月专业能力考核" autocomplete="off"></label><label class="field">关联试卷<select name="paper"><option>信息安全 · 标准卷 A</option><option>企业文化 · 基础卷</option><option>入职培训 · 综合卷</option></select></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><label class="field">考试时长（分钟）<input name="duration" type="number" min="5" max="180" value="60" required></label><label class="field">参与科室<select name="dept"><option>全体员工</option><option>研发部</option><option>人力资源部</option></select></label></div><p class="small muted">示例日期为 2026.10.23 09:00–18:00，模拟参考人数 48 人。正式版应支持时间窗、多科室与考试规则配置。</p></form>`,`<button class="btn" data-action="close-dialog">取消</button><button class="btn primary" type="submit" form="create-form">创建示例考试</button>`);break;
 case'try-exam':$('#dialog').close();navigate('taking');break;
 case'mark':state.marked.has(state.q)?state.marked.delete(state.q):state.marked.add(state.q);render();document.querySelector('[data-action="mark"]').focus();break;
 case'previous':state.q=Math.max(0,state.q-1);render();break;
 case'next':if(state.q===9)submit();else{state.q++;render()}break;
 case'submit':submit();break;
 case'confirm-submit':$('#dialog').close();state.submitted=true;render();toast('模拟答卷已提交');break;
 case'restart':state.q=0;state.answers={};state.marked.clear();state.submitted=false;render();break;
 case'component-toast':toast('这是一条操作反馈示例');break;
 case'print':window.print();break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='exam-search'){state.keyword=e.target.value;updateRows()}});
document.addEventListener('change',e=>{if(e.target.id==='dept-filter'){state.department=e.target.value;updateRows()}if(e.target.name==='answer'){const value=Number(e.target.value);state.answers[state.q]=value;render();document.querySelector(`input[name="answer"][value="${value}"]`).focus()}});
function updateRows(){const rows=filtered();$('#exam-rows').innerHTML=examRows(rows);$('#exam-empty').hidden=!!rows.length;$('#result-count').textContent=`共 ${rows.length} 场考试 · 每页 10 场`}
document.addEventListener('submit',e=>{if(e.target.id!=='create-form')return;e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')).trim();if(!name){e.target.elements.name.setCustomValidity('请输入考试名称');e.target.elements.name.reportValidity();e.target.elements.name.addEventListener('input',()=>e.target.elements.name.setCustomValidity(''),{once:true});return}state.exams.unshift({name,dept:String(f.get('dept')),paper:String(f.get('paper')),status:'未开始',count:0,total:48,date:'10.23 09:00 — 18:00',duration:Number(f.get('duration'))});$('#dialog').close();state.filter='全部考试';state.keyword='';state.department='全部科室';navigate('exams');toast('示例考试已创建，仅保留在当前会话')});

/* Behavior refinements for the design preview; no production API calls. */
const renderBeforePolish = render;
function syncMobileNavigation(){
 const sidebar=document.querySelector('.command-rail');
 if(!sidebar)return;
 const mobile=window.matchMedia('(max-width:740px)').matches;
 const open=sidebar.classList.contains('open');
 sidebar.inert=mobile&&!open;
 sidebar.setAttribute('aria-hidden',String(mobile&&!open));
 const trigger=document.querySelector('[data-action="menu"]');
 if(trigger)trigger.setAttribute('aria-expanded',String(mobile&&open));
 document.body.style.overflow=mobile&&open?'hidden':'';
}
render=function(){
 renderBeforePolish();
 document.body.style.overflow='';
 syncMobileNavigation();
 const heading=document.querySelector('main h1');
 if(heading)heading.setAttribute('tabindex','-1');
 const title=document.querySelector('.command-heading h1');
 if(title)title.setAttribute('aria-label','考务总览');
};
const responsiveNavigation=window.matchMedia('(max-width:740px)');
responsiveNavigation.addEventListener('change',()=>{
 const sidebar=document.querySelector('.command-rail');
 if(sidebar&&!responsiveNavigation.matches)sidebar.classList.remove('open');
 syncMobileNavigation();
});
document.addEventListener('keydown',event=>{
 const sidebar=document.querySelector('.command-rail.open');
 if(!sidebar||!responsiveNavigation.matches)return;
 if(event.key==='Escape'){
  event.preventDefault();sidebar.classList.remove('open');syncMobileNavigation();
  document.querySelector('[data-action="menu"]')?.focus();return;
 }
 if(event.key==='Tab'){
  const items=[...sidebar.querySelectorAll('a[href],button:not([disabled])'),document.querySelector('[data-action="close-menu"]')].filter(Boolean);
  const first=items[0],last=items[items.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
 }
});
document.addEventListener('click',event=>{
 const action=event.target.closest('[data-action]');
 if(action?.dataset.action==='menu'){
  syncMobileNavigation();
  document.querySelector('.command-rail [aria-current="page"]')?.focus();
 }
 if(action?.dataset.action==='close-menu'){
  syncMobileNavigation();document.querySelector('[data-action="menu"]')?.focus();
 }
 if(event.target.closest('[data-nav]')||['previous','next'].includes(action?.dataset.action)){
  if(!document.querySelector('#dialog[open]'))document.querySelector('main h1')?.focus({preventScroll:true});
 }
 if(action?.dataset.action==='task-exams'){
  document.querySelector('#dialog').close();
  state.keyword='';state.filter='全部考试';state.department='全部科室';navigate('exams');
  document.querySelector('main h1')?.focus({preventScroll:true});
 }
 if(action?.dataset.action==='create'){
  const form=document.getElementById('create-form');
  if(form){
   const input=form.elements.name;
   input.insertAdjacentHTML('afterend','<div class="field-error" id="name-error" role="alert" hidden></div>');
   input.setAttribute('aria-describedby','name-error');
   input.focus();
  }
 }
});
document.addEventListener('invalid',event=>{
 const input=event.target;
 if(input.closest('#create-form')&&input.name==='name'){
  const error=document.getElementById('name-error');
  if(error){event.preventDefault();error.textContent='请输入考试名称';error.hidden=false;input.setAttribute('aria-invalid','true');input.focus()}
 }
},true);
document.addEventListener('input',event=>{
 if(event.target.closest('#create-form')&&event.target.name==='name'){
  const error=document.getElementById('name-error');
  if(error){error.hidden=true;event.target.removeAttribute('aria-invalid');event.target.setCustomValidity('')}
 }
});
// Intercept queue actions before the initial prototype's placeholder handler.
document.addEventListener('click',event=>{
 const trigger=event.target.closest('.queue-row[data-todo]');
 if(!trigger)return;
 event.stopImmediatePropagation();
 const title=trigger.dataset.todo;
 const rows=title==='待人工阅卷'?
  [['年度信息安全考核','简答题待评分',6],['第三季度专业能力测评','主观题待评分',4],['企业文化与行为规范','简答题待评分',2]]:
  title==='补考申请'?
  [['第三季度专业能力测评','待审核补考资格',3],['企业文化与行为规范','待审核补考资格',1]]:
  [['第三季度专业能力测评','待核查评分明细',1],['企业文化与行为规范','待核查评分明细',1]];
 modal(title,`<div class="task-summary"><span>按考试汇总 · 示例数据</span><strong>${trigger.dataset.count} <span>项</span></strong></div>${rows.map(([name,desc,count])=>`<div class="task-line"><div><strong>${esc(name)}</strong><small>${desc}</small></div><span>${count}</span></div>`).join('')}<p class="task-local-note">此处用于演示考务待办的信息组织；正式的审批与阅卷流程需连接业务接口。</p>`,`<button class="btn" data-action="close-dialog">关闭</button><button class="btn primary" data-action="task-exams">进入考试管理 ${icon('arrow')}</button>`);
},true);
const specBeforePolish=spec;
spec=function(){return specBeforePolish()
 .replaceAll('28 / 1.4 / 600（总览 36）','28 / 1.4 / 600（总览 34）')
 .replaceAll('指标 32；核心进度 80','指标 32；核心进度 72')
 .replaceAll('日程默认行高 84px','日程默认行高 82px')
 .replaceAll('保留键盘焦点；减少动态效果设置下关闭过渡。','保留键盘焦点；窄屏导航支持焦点约束与 Escape 关闭；表单错误紧贴字段；减少动态效果设置下关闭过渡。')};

navigate(location.hash.slice(1)||'dashboard');
</script>
